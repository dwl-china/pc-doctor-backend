# 测试 profile：
# - 本地：复用开发库 pc_doctor（集成测试类 @Transactional 回滚，不污染数据），凭据来自 .env
# - CI：GitHub Actions 的 MySQL service 提供全新库，凭据经 TEST_DB_* 环境变量注入
spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:pc_doctor}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TEST_DB_USERNAME:pcdoctor}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
  flyway:
    placeholders:
      # CI 全新库迁移时种子的管理员密码；本地库已存在 admin，此占位符不生效
      admin_initial_password: ${TEST_ADMIN_PASSWORD:TestAdmin#12345}

# 测试专用管理员密码（本地取 .env 的 ADMIN_INITIAL_PASSWORD，CI 取 TEST_ADMIN_PASSWORD）
test:
  admin-password: ${TEST_ADMIN_PASSWORD:${ADMIN_INITIAL_PASSWORD:TestAdmin#12345}}

pc-doctor:
  jwt:
    # 固定测试密钥（≥32 字节），不依赖环境
    secret: test-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
    expiration-minutes: 60
  upload:
    # 测试上传目录放 build/（已被 gitignore）
    path: ./build/test-upload/