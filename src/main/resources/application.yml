spring:
  application:
    name: pc-doctor-backend
  autoconfigure:
    # 认证走 JWT 过滤器 + AuthService bcrypt 校验，不需要 in-memory 用户与随机生成密码
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration
    # 迁移占位符：V3__seed_admin 管理员种子经此处从环境变量/.env 注入，密码不明文入库
    placeholders:
      admin_username: ${ADMIN_USERNAME:admin}
      admin_display_name: ${ADMIN_DISPLAY_NAME:管理员}
      admin_initial_password: ${ADMIN_INITIAL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

pc-doctor:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  upload:
    path: ${PC_UPLOAD_PATH:./upload/}
  cors:
    # 逗号分隔的允许来源列表（@ConfigurationProperties 绑定为 List）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
